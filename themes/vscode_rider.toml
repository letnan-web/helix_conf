"comment" = { fg = "comment" }
"comment.block.documentation" = { fg = "comment_doc" }

"keyword" = { fg = "keyword" }
"keyword.control" = { fg = "keyword_control" }
"keyword.control.import" = { fg = "keyword_control" }
"keyword.control.return" = { fg = "keyword_control" }
"keyword.control.exception" = { fg = "keyword_control" }
"keyword.directive" = { fg = "keyword" }
"keyword.operator" = { fg = "keyword" }
"keyword.function" = { fg = "keyword" }
"keyword.storage" = { fg = "keyword" }

"string" = { fg = "string" }
"string.regexp" = { fg = "regexp" }
"string.special" = { fg = "string_escape" }
"constant.character.escape" = { fg = "string_escape" }
"constant.character" = { fg = "string" }

"constant" = { fg = "constant" }
"constant.builtin" = { fg = "keyword" }
"constant.numeric" = { fg = "number" }

"type" = { fg = "class" }
"type.builtin" = { fg = "class" }
"type.parameter" = { fg = "type_parameter" }
"type.enum" = { fg = "class" }
"type.enum.variant" = { fg = "enum_member" }
"constructor" = { fg = "class" }
"namespace" = { fg = "class" }
"special" = { fg = "function" }

"function" = { fg = "function" }
"function.method" = { fg = "function" }
"function.builtin" = { fg = "function" }
"function.macro" = { fg = "function" }
"function.special" = { fg = "function" }

"variable" = { fg = "variable" }
"variable.builtin" = { fg = "keyword" }
"variable.parameter" = { fg = "variable" }
"variable.other.member" = { fg = "constant" }

"attribute" = { fg = "class" }
"label" = { fg = "variable" }
"operator" = { fg = "foreground" }
"punctuation" = { fg = "foreground" }
"punctuation.delimiter" = { fg = "foreground" }
"punctuation.bracket" = { fg = "foreground" }

"tag" = { fg = "keyword" }
"markup.heading" = { fg = "keyword", modifiers = ["bold"] }
"markup.bold" = { modifiers = ["bold"] }
"markup.italic" = { modifiers = ["italic"] }
"markup.link.url" = { fg = "constant", modifiers = ["underlined"] }
"markup.link.text" = { fg = "string" }
"markup.quote" = { fg = "comment" }
"markup.raw" = { fg = "string" }

"diff.plus" = { fg = "added" }
"diff.minus" = { fg = "removed" }
"diff.delta" = { fg = "modified" }

"ui.background" = { bg = "background" }
"ui.text" = { fg = "foreground" }
"ui.text.focus" = { bg = "selection" }
"ui.cursor" = { fg = "background", bg = "cursor" }
"ui.cursor.primary" = { fg = "background", bg = "cursor" }
"ui.cursor.match" = { bg = "bracket_match", modifiers = ["bold"] }
"ui.cursorline.primary" = { bg = "cursorline" }
"ui.cursorline.secondary" = { bg = "cursorline" }
"ui.selection" = { bg = "selection" }
"ui.selection.primary" = { bg = "selection" }
"ui.linenr" = { fg = "line_number" }
"ui.linenr.selected" = { fg = "line_number_active" }
"ui.virtual.whitespace" = { fg = "whitespace" }
"ui.virtual.indent-guide" = { fg = "indent_guide" }
"ui.virtual.ruler" = { bg = "ruler" }
"ui.virtual.inlay-hint" = { fg = "inlay_hint" }
"ui.virtual.jump-label" = { fg = "jump_label", modifiers = ["bold"] }

"ui.statusline" = { fg = "statusline_fg", bg = "statusline_bg" }
"ui.statusline.inactive" = { fg = "line_number", bg = "panel" }
"ui.statusline.normal" = { fg = "statusline_fg", bg = "accent" }
"ui.statusline.insert" = { fg = "statusline_fg", bg = "added" }
"ui.statusline.select" = { fg = "statusline_fg", bg = "keyword_control" }

"ui.bufferline" = { fg = "line_number", bg = "panel" }
"ui.bufferline.active" = { fg = "foreground", bg = "background" }
"ui.bufferline.background" = { bg = "panel" }

"ui.popup" = { fg = "foreground", bg = "panel" }
"ui.window" = { fg = "border" }
"ui.help" = { fg = "foreground", bg = "panel" }
"ui.menu" = { fg = "foreground", bg = "panel" }
"ui.menu.selected" = { bg = "selection" }
"ui.menu.scroll" = { fg = "line_number", bg = "panel" }

"diagnostic.error" = { underline = { color = "error", style = "curl" } }
"diagnostic.warning" = { underline = { color = "warning", style = "curl" } }
"diagnostic.info" = { underline = { color = "info", style = "curl" } }
"diagnostic.hint" = { underline = { color = "hint", style = "curl" } }
"diagnostic.unnecessary" = { modifiers = ["dim"] }
"error" = { fg = "error" }
"warning" = { fg = "warning" }
"info" = { fg = "info" }
"hint" = { fg = "hint" }

