theme = "vscode_rider"

[editor]
mouse = false
cursorline = true
true-color = true
line-number = "absolute"
scrolloff = 8
bufferline = "multiple"
color-modes = true

[editor.cursor-shape]
insert = "bar"
normal = "block"
select = "underline"

# [editor.whitespace]
# render = "all"

# [editor.whitespace.characters]
# space = "·"
# tab = "→"
# newline = "⏎"

[editor.indent-guides]
render = true
character = "▏"

[editor.statusline]
left = ["mode", "spinner", "file-name", "file-modification-indicator"]
center = []
right = ["diagnostics", "selections", "position", "file-encoding", "file-type"]

[editor.lsp]
display-messages = true

[editor.auto-save.after-delay]
enable = true
timeout = 50

